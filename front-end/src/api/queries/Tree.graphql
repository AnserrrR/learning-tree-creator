query GetTreeById($id: UUID!) {
    getTreeById(id: $id) {
        id
        createdAt
        updatedAt
        deletedAt
        name
        description
        nodes {
            id
            positionX
            positionY
            isComplete
            label
            nodeType
            targetPosition
        }
        edges {
            targetPosition
            sourcePosition
            targetId
            sourceId
        }
    }
}
